<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake News Detection</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script>
async function predictNews() {
    const text = document.getElementById("newsText").value.trim();

    if (!text) {
        alert("Please enter some news text");
        return;
    }

    const response = await fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
    });

    const data = await response.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    const resultBox = document.getElementById("resultBox");
    const resultAlert = document.getElementById("resultAlert");
    const resultText = document.getElementById("resultText");
    const confidenceText = document.getElementById("confidenceText");
    const confidenceBar = document.getElementById("confidenceBar");

    const confidencePercent = (data.confidence * 100).toFixed(2);

    resultBox.classList.remove("d-none");

    if (data.prediction === "fake") {
        resultAlert.className = "alert alert-danger text-center";
        resultText.innerHTML = "🚨 FAKE NEWS DETECTED";
        confidenceBar.className = "progress-bar bg-danger";
    } else {
        resultAlert.className = "alert alert-success text-center";
        resultText.innerHTML = "✅ REAL NEWS";
        confidenceBar.className = "progress-bar bg-success";
    }

    confidenceText.innerHTML = `Confidence: <strong>${confidencePercent}%</strong>`;
    confidenceBar.style.width = confidencePercent + "%";
    confidenceBar.innerText = confidencePercent + "%";
}
</script>


</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Fake News Detection System</h2>

       
            <div class="mb-3">
              <textarea class="form-control" id="newsText" rows="6"
              placeholder="Paste news text here..." required></textarea>
   

            </div>

            <div class="d-grid">
                    <button type="button" class="btn btn-primary" onclick="predictNews()">
                                 Check News
                    </button>

            </div>

         <!-- Result Section -->
<div id="resultBox" class="mt-4 d-none">
    <div class="alert text-center" id="resultAlert">
        <h4 id="resultText"></h4>
        <p id="confidenceText"></p>

        <div class="progress mt-2">
            <div class="progress-bar" id="confidenceBar"
                 role="progressbar">
            </div>
        </div>
    </div>
</div>

        
    </div>
</div>

</body>
</html>
